<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小饭馆 · 扫码点餐</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="hero">
  <div class="hero-bg" style="background-image:url('/images/gongbao.webp')"></div>
  <div class="hero-inner">
    <div class="brand-row">
      <div class="brand-mark">小</div>
      <div class="brand-text">
        <h1>小饭馆</h1>
        <p>SCAN · ORDER · ENJOY</p>
      </div>
      <div class="table-chip">桌号 <strong id="tableNo">A01</strong></div>
    </div>
    <div class="hero-copy">
      <span class="eyebrow">今日菜单</span>
      <h2>认真做菜，<br>好好吃饭。</h2>
      <p>扫码点餐 · 现点现做</p>
    </div>
  </div>
</header>

<main>
  <section class="menu-head">
    <h2>招牌菜</h2>
    <span id="menuCount" class="muted">加载中…</span>
  </section>
  <div id="list" class="menu-list"></div>
</main>

<div id="cartBar" class="cart-bar">
  <button class="cart-summary" onclick="openCart()">
    <span class="cart-dot" id="cartBadge">0</span>
    <span class="cart-text">已选 <b id="cartCount">0</b> 份 · ￥<b id="cartTotal">0.00</b></span>
  </button>
  <button class="cart-arrow" onclick="openCart()" aria-label="上拉查看已选菜品">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 14l6-6 6 6"/>
    </svg>
  </button>
  <button class="primary" onclick="openCart()">去结算</button>
</div>

<div id="overlay" class="overlay">
  <section id="cartPanel" class="panel">
    <div class="panel-handle"></div>
    <header class="panel-head">
      <div>
        <span class="eyebrow">确认订单</span>
        <h2>桌号 <span id="panelTable">A01</span></h2>
      </div>
      <button class="icon-btn" onclick="closePanels()" aria-label="关闭">×</button>
    </header>
    <div id="cartList" class="cart-list"></div>
    <div class="panel-total">合计 <b id="panelTotal">￥0.00</b></div>
    <button class="primary block" onclick="submitOrder()">提交订单</button>
  </section>

  <section id="spicePanel" class="panel hidden">
    <div class="panel-handle"></div>
    <header class="panel-head">
      <div>
        <span class="eyebrow">选择辣度</span>
        <h2 id="spiceDishName">宫保鸡丁</h2>
      </div>
      <button class="icon-btn" onclick="closePanels()" aria-label="关闭">×</button>
    </header>
    <div class="spice-dish">
      <img id="spiceDishImg" class="spice-thumb" alt="">
      <div class="spice-dish-info">
        <p id="spiceDishDesc" class="muted"></p>
        <div class="price" id="spiceDishPrice"></div>
      </div>
    </div>
    <div id="spiceOptions" class="spice-options"></div>
    <button class="primary block" onclick="confirmSpiceAdd()">确认加入</button>
  </section>

  <section id="successPanel" class="panel success">
    <div class="success-mark">✓</div>
    <span class="eyebrow">ORDER CONFIRMED</span>
    <h2>下单成功</h2>
    <p class="muted">订单号 <b id="orderId"></b> · 桌号 <b id="orderTable"></b></p>
    <div id="orderItems" class="order-items"></div>
    <div class="panel-total">合计 <b id="orderTotal"></b></div>
    <button class="primary block" onclick="viewOrderStatus()">查看订单进度</button>
    <button class="link-btn" onclick="closeSuccess()">继续点餐</button>
  </section>
</div>

<div id="toast" class="toast"></div>
<script src="/js/app.js"></script>
</body>
</html>
